name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Help us fix it by providing as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of the bug.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: dropdown
    id: affected-services
    attributes:
      label: Affected Services
      description: Which parts of the system are affected?
      multiple: true
      options:
        - execution-service
        - tool-gateway
        - telegram-bot
        - ui
        - db (schema/migrations)
        - shared-types
        - event-schemas
        - tool-contracts
        - infra
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - domain:backend
        - domain:frontend
        - domain:database
        - domain:infra
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - priority:medium
        - priority:high
        - priority:critical
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node version, or any relevant environment details.
      placeholder: "macOS 15, Chrome 130, Node 22.x, local dev"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant error output or attach screenshots.
    validations:
      required: false
