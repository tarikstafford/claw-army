name: Auto-Assign Issues to Milestone

on:
  issues:
    types: [opened, labeled]

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            
            // Check if issue has any effort:* or type:* label
            const hasMilestoneLabel = labels.some(l => 
              l.startsWith('effort:') || 
              l.startsWith('type:') ||
              l.startsWith('priority:')
            );
            
            // Check if issue is already in a milestone
            return {
              number: issue.number,
              title: issue.title,
              labels: labels,
              hasMilestoneLabel: hasMilestoneLabel,
              milestone: issue.milestone?.title || null
            };

      - name: Assign to v1.0 milestone if labeled
        if: steps.issue.outputs.hasMilestoneLabel == 'true' && steps.issue.outputs.milestone == null
        uses: actions/github-script@v7
        with:
          script: |
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            
            const v1Milestone = milestones.data.find(m => m.title === 'v1.0 - Baseline');
            
            if (v1Milestone) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ steps.issue.outputs.number }},
                milestone: v1Milestone.number
              });
              console.log('Assigned issue ${{ steps.issue.outputs.number }} to v1.0 milestone');
            }
