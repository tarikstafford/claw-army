name: Issue Triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    environment: production
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Configure OpenCode auth
        run: |
          mkdir -p ~/.local/share/opencode
          echo '{"minimax-coding-plan":{"type":"api","key":"'"$MINIMAX_API_KEY"'"}}' > ~/.local/share/opencode/auth.json

      - name: Run OpenCode
        env:
          MODEL: minimax-coding-plan/MiniMax-M2.7
          PROMPT: |
            You are an AI agent helping triage a new GitHub issue for the Akasa platform (claw-army).

            Akasa is a D2C platform for deploying and evolving AI agent fleets. The codebase includes:
            - SvelteKit v2 frontend (services/ui/)
            - Fastify v5 backends (services/execution-service/, services/akasa-server/, services/tool-gateway/)
            - Drizzle ORM + PostgreSQL/pgvector database (packages/db/)
            - Evolution engine with soul system, council, and god layer
            - BullMQ task queue with Redis

            Review this issue:
            1. Provide a clear summary of the problem or feature request
            2. Suggest labels from this set: domain:frontend, domain:backend, domain:database, domain:infra, priority:critical, priority:high, priority:medium, type:docs, type:bug, type:techdebt, type:feature, effort:small, effort:medium, effort:large
            3. If it's a bug, suggest reproduction steps or root cause
            4. If it's a feature, suggest which service(s) would be affected
            5. Do NOT make any code changes - just provide analysis

            Format your response as:
            ## Summary
            [2-3 sentence summary]

            ## Suggested Labels
            - [label list]

            ## Affected Components
            - [which parts of the codebase]

            ## Analysis Notes
            [Any additional context]
        run: opencode github run
