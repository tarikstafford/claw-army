services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clawdb
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  tool-gateway:
    build:
      context: .
      dockerfile: services/tool-gateway/Dockerfile
    container_name: tool-gateway
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      # BOT_JWT_SECRET: must be set in production. Falls back to dev secret (insecure) if unset.
      - BOT_JWT_SECRET=${BOT_JWT_SECRET:-claw-dev-secret-do-not-use-in-prod}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/clawdb
      - REDIS_URL=redis://redis:6379
      - ARTIFACT_ROOT=/artifacts
      # FETCH_URL_DOMAIN_ALLOWLIST: for /tool.invoke backward compat (comma-separated).
      - FETCH_URL_DOMAIN_ALLOWLIST=${FETCH_URL_DOMAIN_ALLOWLIST:-}
      # PROXY_DOMAIN_ALLOWLIST: domains bot VMs may reach via the forward proxy.
      # Leave empty to allow all domains (development only).
      # Production example: "api.anthropic.com,api.openai.com,generativelanguage.googleapis.com"
      - PROXY_DOMAIN_ALLOWLIST=${PROXY_DOMAIN_ALLOWLIST:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - claw-artifacts:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# ── Bot VMs ───────────────────────────────────────────────────────────────────
# Bot containers (Docker) are NO LONGER used. Bots now run as GCE VMs provisioned
# at runtime by execution-service via @google-cloud/compute (gce-bot-launcher.ts).
#
# Local development notes:
#   - GCE VM provisioning requires Application Default Credentials:
#       gcloud auth application-default login
#   - Set GCP_PROJECT_ID, GCP_ZONE, GCP_NETWORK, GCP_SUBNET, LLM_API_KEY_SECRET_NAME
#     in execution-service/.env for local dev against a real GCP project.
#   - The tool-gateway now also acts as an HTTP forward proxy (port 3002).
#     Bot VMs are configured with HTTP_PROXY=http://tool-gateway:3002 in startup.sh.tpl.

networks:
  default:
    driver: bridge

volumes:
  pg-data:
  claw-artifacts:    # write_file artifacts stored here (legacy /tool.invoke support)
